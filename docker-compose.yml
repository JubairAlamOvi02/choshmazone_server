version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: choshmazone_db
    restart: always
    environment:
      POSTGRES_DB: choshmazone
      POSTGRES_USER: choshma_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChooseAStrongPassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choshma_user -d choshmazone"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - choshmazone_net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: choshmazone_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: choshmazone
      DB_USER: choshma_user
      DB_PASSWORD: ${DB_PASSWORD:-ChooseAStrongPassword123!}
      JWT_SECRET: ${JWT_SECRET:-choshmazone_super_secret_jwt_key_987654321}
      JWT_EXPIRES_IN: 7d
      BASE_URL: ${BASE_URL:-https://choshmazone.tech}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8639759587:AAHgCaAwJfu35H2CYTFRhgpRDNYYwt9s8LQ}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-2119791189}
      GOOGLE_SCRIPT_URL: ${GOOGLE_SCRIPT_URL:-https://script.google.com/macros/s/AKfycbxEmGDmu1IRiz9MqKBAnIH_SDfG9GJTIHfbRIipKw5Lb_vC_B9KorTUu6fbpP11ZmNF/exec}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - choshmazone_net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: choshmazone_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - choshmazone_net

volumes:
  postgres_data:
  uploads_data:

networks:
  choshmazone_net:
    driver: bridge

